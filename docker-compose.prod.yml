services:
  google-contacts-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-contacts-mcp
    env_file:
      - /app/data/google-contacts/.env
    ports:
      - "8080:8080"
    networks:
      - proxy-network
    restart: unless-stopped

networks:
  proxy-network:
    external: true
