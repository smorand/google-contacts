services:
  google-contacts:
    build: .
    container_name: google-contacts
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - /app/data/google-contacts/.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
